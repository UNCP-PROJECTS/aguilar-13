              schema:
                $ref: '#/components/schemas/UsuarioSeguro'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        ViewSet dedicado para gestión de CSRF en SPA/AJAX, autenticación de sesión
        y emisión de tokens DRF stateless sin exponer campos sensibles.
      summary: Emisión de Token DRF stateless para clientes API/Postman/cURL
      tags:
      - Autenticación & CSRF
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Token DRF retornado sin requerir cookies de sesión
  /api/v1/health/:
    get:
      operationId: health_list
      description: Sonda de salud del servicio RESTful orientada a contenedores y
        microservicios (Semana 14).
      summary: Health check de disponibilidad y latencia de base de datos
      tags:
      - Infraestructura
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: Servicio operativo y listo para balanceador/Docker
