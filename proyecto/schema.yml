          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartamentoRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
          description: ''
    patch:
      operationId: departamentos_partial_update
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Actualización parcial de departamento TI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Departamento TI.
        required: true
      tags:
      - Departamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDepartamentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDepartamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDepartamentoRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
          description: ''
  /api/v1/activos/:
    get:
      operationId: activos_list
      description: |-
        ModelViewSet principal de Activos TI y Microservicios.
        Hereda permission_classes, filter_backends y pagination_class desde settings.REST_FRAMEWORK.
      summary: Listar activos y microservicios TI (Paginado, Filtrado y HATEOAS)
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: criticidad
        schema:
          type: string
        description: Filtrar por criticidad (BAJA, MEDIA, ALTA, CRITICA)
      - in: query
        name: departamento
        schema:
          type: number
      - in: query
        name: departamento_codigo
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
        description: Ordenar por campo (ej. -created, sla_horas)
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: sla_horas_max
        schema:
          type: integer
      - in: query
        name: sla_horas_min
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filtrar por estado (activo, mantenimiento, degradado, inactivo)
      - in: query
        name: tipo
        schema:
          type: string
      tags:
      - Activos TI
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivoTIHyperlinkedList'
          description: ''
    post:
      operationId: activos_create
      description: |-
        ModelViewSet principal de Activos TI y Microservicios.
        Hereda permission_classes, filter_backends y pagination_class desde settings.REST_FRAMEWORK.
      summary: Registrar nuevo Activo TI
      tags:
      - Activos TI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoTIHyperlinkedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivoTIHyperlinkedRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivoTIHyperlinkedRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivoTIHyperlinked'
          description: ''
  /api/v1/activos/resumen-metricas/:
    get:
      operationId: activos_resumen_metricas_retrieve
