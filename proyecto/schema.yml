openapi: 3.0.3
info:
  title: UNCP FIS • TechGrid RESTful API Gateway
  version: 1.0.0
  description: API RESTful production-ready construida con Django REST Framework (DRF)
    para la gestión de Activos TI, Microservicios, Departamentos e Incidentes Operativos.
    Implementa navegación HATEOAS, serialización hipervinculada, filtrado lazy en
    BD, paginación estándar, throttling multicapa, CORS restringido, protección CSRF
    y telemetría de preparación para arquitectura de microservicios (Semana 14).
  contact:
    name: José Pablo Osorio Mallqui (UNCP FIS - 2022200839H)
    email: 2022200839h@uncp.edu.pe
paths:
  /api/v1/departamentos/:
    get:
      operationId: departamentos_list
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Listar departamentos TI
      parameters:
      - in: query
        name: activo
        schema:
          type: boolean
      - in: query
        name: codigo
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Departamentos
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartamentoList'
          description: ''
    post:
      operationId: departamentos_create
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Registrar nuevo departamento TI
      tags:
      - Departamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartamentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartamentoRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
          description: ''
  /api/v1/departamentos/{id}/:
    get:
      operationId: departamentos_retrieve
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Obtener detalle de departamento TI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Departamento TI.
        required: true
      tags:
      - Departamentos
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
          description: ''
    delete:
      operationId: departamentos_destroy
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Eliminar departamento TI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Departamento TI.
        required: true
      tags:
      - Departamentos
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
    put:
      operationId: departamentos_update
      description: ViewSet CRUD para Departamentos TI heredando permisos, paginación
        y filtros globales.
      summary: Actualizar departamento TI
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Departamento TI.
        required: true
      tags:
