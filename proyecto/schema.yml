          description: Cookie csrftoken emitida y token retornado en JSON
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        ViewSet dedicado para gestión de CSRF en SPA/AJAX, autenticación de sesión
        y emisión de tokens DRF stateless sin exponer campos sensibles.
      summary: Autenticación de sesión SPA (valida X-CSRFToken) y retorno de Token
        DRF
      tags:
      - Autenticación & CSRF
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginAPIRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: Sesión iniciada y token emitido
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        ViewSet dedicado para gestión de CSRF en SPA/AJAX, autenticación de sesión
        y emisión de tokens DRF stateless sin exponer campos sensibles.
      summary: Cerrar sesión SPA activa
      tags:
      - Autenticación & CSRF
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: Sesión finalizada
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        ViewSet dedicado para gestión de CSRF en SPA/AJAX, autenticación de sesión
        y emisión de tokens DRF stateless sin exponer campos sensibles.
      summary: Consultar perfil seguro del usuario autenticado
      tags:
      - Autenticación & CSRF
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
